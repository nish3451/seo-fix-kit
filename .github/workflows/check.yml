name: Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install from lockfile
        run: npm ci
      - name: Run canonical check
        # The local test-gate slot wrapper does not exist on hosted runners, so
        # the canonical `npm run check` (unit/smoke tests + build) runs directly.
        # A failing script fails the job (fails closed); npm ci never modifies
        # the committed lockfile and errors if package.json is out of sync.
        run: npm run check
