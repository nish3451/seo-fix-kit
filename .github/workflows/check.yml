name: check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned to actions/checkout@v4 (11d5960a326750d5838078e36cf38b85af677262)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Pinned to actions/setup-node@v4 (49933ea5288caeca8642d1e84afbd3f7d6820020)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: npm ci
      # `npm run check` already ends with `npm run build`; do not add a build step.
      - run: npm run check
